<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Uji Unggah Foto Survei</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 520px; margin: 0 auto; padding: 16px; color: #1d2b33; background: #f6f7f4; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.kecil { margin: 0 0 14px; color: #55656d; font-size: 14px; }
  label { display: block; margin-top: 12px; font-weight: 600; font-size: 14px; }
  input, button { width: 100%; padding: 10px; font: inherit; border: 1px solid #b9c3c7; border-radius: 6px; background: #fff; }
  button { background: #1d2b33; color: #fff; border: 0; margin-top: 14px; cursor: pointer; }
  button.sekunder { background: #fff; color: #1d2b33; border: 1px solid #1d2b33; margin-top: 6px; }
  button:disabled { opacity: .5; }
  .baris { display: flex; gap: 8px; } .baris > div { flex: 1; }
  #hasil { margin-top: 16px; padding: 10px 12px; border-left: 4px solid #d9822b; background: #fff; white-space: pre-wrap; }
  #hasil.ok { border-color: #2f6f6a; } #hasil.gagal { border-color: #b3362b; }
</style>
</head>
<body>
<h1>Uji Unggah Foto Survei</h1>
<p class="kecil">Halaman uji untuk memastikan foto masuk ke Drive lewat Apps Script. Bukan aplikasi akhir.</p>

<label for="url">Alamat skrip (berakhiran /exec)</label>
<input id="url" inputmode="url" placeholder="https://script.google.com/macros/s/.../exec">
<label for="kode">Kode akses petugas</label>
<input id="kode" type="password" autocomplete="off">

<label for="foto">Foto</label>
<input id="foto" type="file" accept="image/*">

<div class="baris">
  <div><label for="lat">Lintang</label><input id="lat" inputmode="decimal"></div>
  <div><label for="lon">Bujur</label><input id="lon" inputmode="decimal"></div>
</div>
<button class="sekunder" id="gps" type="button">Ambil lokasi saat ini</button>

<div class="baris">
  <div><label for="bearing">Arah (0-360°)</label><input id="bearing" inputmode="numeric" value="0"></div>
  <div><label for="ruas">Nama jalan</label><input id="ruas" placeholder="Jl. Contoh A"></div>
</div>
<label for="catatan">Catatan (opsional)</label>
<input id="catatan">

<button id="kirim" type="button">Unggah</button>
<div id="hasil" hidden></div>

<script>
const $ = id => document.getElementById(id);
const simpan = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const muat = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
$('url').value = muat('uji_url'); $('kode').value = muat('uji_kode');

function tampil(teks, kelas) { const h = $('hasil'); h.hidden = false; h.className = kelas || ''; h.textContent = teks; }

$('gps').onclick = () => {
  if (!navigator.geolocation) return tampil('Peramban ini tidak mendukung lokasi.', 'gagal');
  tampil('Mencari lokasi…');
  navigator.geolocation.getCurrentPosition(
    p => { $('lat').value = p.coords.latitude.toFixed(6); $('lon').value = p.coords.longitude.toFixed(6); tampil('Lokasi terisi (akurasi ±' + Math.round(p.coords.accuracy) + ' m).', 'ok'); },
    e => tampil('Lokasi gagal: ' + e.message, 'gagal'), { enableHighAccuracy: true, timeout: 20000 });
};

// Perkecil foto ke maksimal 1600 px sisi terpanjang, JPEG kualitas 0,8.
function kecilkan(file) {
  return new Promise((ok, gagal) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      ok(c.toDataURL('image/jpeg', 0.8).split(',')[1]);
    };
    img.onerror = () => gagal(new Error('Foto tidak bisa dibaca.'));
    img.src = u;
  });
}

function waktuLokal() {
  const d = new Date(), p = n => String(n).padStart(2, '0'), z = -d.getTimezoneOffset();
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}` +
    `${z >= 0 ? '+' : '-'}${p(Math.floor(Math.abs(z) / 60))}:${p(Math.abs(z) % 60)}`;
}

$('kirim').onclick = async () => {
  const f = $('foto').files[0];
  if (!$('url').value || !$('kode').value) return tampil('Isi alamat skrip dan kode akses.', 'gagal');
  if (!f) return tampil('Pilih foto dulu.', 'gagal');
  if (!$('lat').value || !$('lon').value) return tampil('Isi koordinat atau tekan "Ambil lokasi saat ini".', 'gagal');
  simpan('uji_url', $('url').value); simpan('uji_kode', $('kode').value);
  $('kirim').disabled = true; tampil('Memperkecil dan mengirim foto…');
  try {
    const w = waktuLokal();
    const id = w.slice(0, 10).replace(/-/g, '') + '-' + w.slice(11, 19).replace(/:/g, '') + '-' + Math.random().toString(36).slice(2, 6);
    const body = {
      kode: $('kode').value,
      titik: { id, waktu: w, lat: $('lat').value, lon: $('lon').value, bearing: $('bearing').value, ruas: $('ruas').value, catatan: $('catatan').value },
      foto: { mime: 'image/jpeg', dataBase64: await kecilkan(f) }
    };
    // text/plain menghindari pemeriksaan CORS awal yang tidak didukung Apps Script
    const r = await fetch($('url').value.trim(), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
    const j = await r.json();
    if (j.ok) tampil(`Berhasil.\nID: ${j.id}\nFile sesi: ${j.sesi}` + (j.duplikat ? '\n(titik ini sudah ada sebelumnya)' : ''), 'ok');
    else tampil('Ditolak: ' + j.pesan, 'gagal');
  } catch (e) {
    tampil('Gagal mengirim: ' + e.message + '\nPeriksa alamat skrip, pengaturan akses "Siapa saja", dan koneksi.', 'gagal');
  }
  $('kirim').disabled = false;
};
</script>
</body>
</html>
